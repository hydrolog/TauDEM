[project]
name = "TauDEM"
version = "5.3.9"
description = "TauDEM (Terrain Analysis Using Digital Elevation Models)"
authors = ["David Tarboton <dtarb@usu.edu"]
channels = ["conda-forge"]
platforms = ["linux-64","win-64","osx-64"]

[tasks.buildwin]
#cmd = "./build.ps1"
cmd = ["cmake", "--build", "./build-win-64"]
depends-on = ["configure"]
inputs = ["CMakeLists.txt","src/*"]
outputs = ["./build-win-64/taudem/"]

[tasks.buildlinux]
cmd = "./build.sh"

[tasks.configure]
#configure cmake
cmd = [
  "cmake",
  "-GNinja",
  "-S./src",
  "-B./build-win-64",
]
inputs = ["CMakeLists.txt"]
outputs = ["./build-win-64/CMakeFiles/"]

[dependencies]
mpi = ">=1.0,<2"
cxx-compiler = ">=1.7.0,<1.8"
libgdal = ">=3.8.5,<3.9"
binutils = ">=1.0.1,<3"
ninja = ">=1.12.1,<1.13"
mkl = ">=2023.2.0,<2024.3"
cmake = ">=3.30.0,<3.31"

[target.linux-64.dependencies]
mpich-mpicxx = ">=4.2.1,<4.3"
mpich = ">=4.2.1,<4.3"
make = ">=4.3,<5"

[target.win-64.dependencies]
msmpi = ">=10.1.1,<10.2"
bzip2 = ">=1.0.8,<1.1"
m2-libbz2 = ">=1.0.6,<1.1"
intel-openmp = ">=2024.2.0,<2024.3"

[target.win-64.activation]
scripts = ["setvars_intel.bat"]
