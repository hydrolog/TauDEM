[project]
name = "TauDEM"
version = "5.3.9"
description = "TauDEM (Terrain Analysis Using Digital Elevation Models)"
authors = ["David Tarboton <dtarb@usu.edu"]
channels = ["conda-forge"]
platforms = ["linux-64","win-64"]

[target.win-64.tasks.build]
#cmd = "./build.ps1"
# Run on dev pwsh msvc console enviroment
cmd = ["cmake", "--build", "./build-win-64"]
depends-on = ["configure"]
#inputs = ["src/CMakeLists.txt","src/*"]
#outputs = ["./build-win-64/taudem/"]

[target.linux-64.tasks.build]
cmd = ["cmake", "--build", "./build-linux-64"]
depends-on = ["configure"]

[target.win-64.tasks.configure]
cmd = [
  "cmake",
  "-GNinja",
  "-S./src",
  "-B./build-win-64",
]

[target.linux-64.tasks.configure]
cmd = [
  "cmake",
  "-GNinja",
  "-S./src",
  "-B./build-linux-64",
]

[target.linux-64.dependencies]
mpich-mpicxx = ">=4.2.1,<4.3"
mpich = ">=4.2.1,<4.3"
ninja = ">=1.12.1,<1.13"
cmake = ">=3.30.0,<3.31"
gcc = ">=12.3.0,<12.4"

[dependencies]
libgdal = ">=3.9.1,<4"
gdal = ">=3.9.1,<4"

[target.win-64.activation]
scripts = ["setvars_msvc.bat"]

[target.win-64.dependencies]
cmake = ">=3.30.1,<4"
